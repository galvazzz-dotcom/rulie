<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3ec5f0">
<meta name="version" content="2026-10-21-apprendre-revu">
<title>🚜 La Ferme de Roullieee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--encre:#3b2412;--creme:#fff8e7;--or:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3ec5f0}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--encre);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;border:0;cursor:pointer;touch-action:manipulation;color:inherit;background:none;padding:0}
.cache{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ── bulles au-dessus des objets 3D ── */
#bulles{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.bulle{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform}
.bulle .in{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;min-width:50px;height:50px;padding:0 9px;border-radius:999px;background:#fff;
  font-size:27px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.2);border:3px solid #fff;white-space:nowrap}
.bulle .in::after{content:'';position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.bulle .in small{font-size:17px}
.bulle.faim .in{background:#f1f5f9;opacity:.94;font-size:24px}
.bulle.pret .in{background:linear-gradient(#fff6b0,#ffd23f);animation:saute .7s ease-in-out infinite alternate}
.bulle.pret .in::after{border-top-color:#ffd23f}
.bulle.lock .in{background:#7c4a1d;color:#fff;font-size:19px;border-color:#ffd23f}
.bulle.lock .in::after{border-top-color:#7c4a1d}
.bulle.pad .in{background:linear-gradient(#bbf7d0,#4ade80);font-size:22px;border-color:#fff}
.bulle.pad .in::after{border-top-color:#4ade80}
.bulle.pad.sur .in{animation:saute .35s ease-in-out infinite alternate}
.bulle.vente .in{background:linear-gradient(#ffe46b,#ffb300);font-size:20px}
.bulle.vente .in::after{border-top-color:#ffb300}
.bulle.info .in{font-size:20px;height:44px}
/* l'étal peut porter 13 produits : sa bulle passe à la ligne au lieu de déborder */
.bulle.info.etal .in{height:auto;min-height:34px;flex-wrap:wrap;max-width:min(78vw,330px);white-space:normal;padding:4px 10px;column-gap:8px}
.bulle.info.etal .in span{white-space:nowrap}
.bulle.plein .in{background:#ef4444;color:#fff;font-size:18px;animation:saute .3s ease-in-out infinite alternate}
.bulle.plein .in::after{border-top-color:#ef4444}
.bulle.cmd .in{font-size:22px;background:#fff;border-color:#3a86ff;height:auto;min-height:50px;padding:4px 10px}
.bulle.cmd .in::after{border-top-color:#3a86ff}
.bulle .ok{color:#16a34a}
@keyframes saute{from{transform:translateY(0) scale(1)}to{transform:translateY(-8px) scale(1.06)}}
#parole{position:absolute;left:0;top:0;max-width:min(80vw,26rem);background:#fff;border:4px solid var(--or);border-radius:22px;padding:12px 16px;font-size:clamp(17px,2.4vmin + 8px,24px);font-weight:600;
  box-shadow:0 8px 20px rgba(0,0,0,.25);pointer-events:auto;z-index:6}
#parole::after{content:'';position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);border:12px solid transparent;border-top-color:var(--or);border-bottom:0}

/* ── joystick ── */
#joy{position:fixed;z-index:9;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.25);border:4px solid rgba(255,255,255,.7);pointer-events:none}
#joyK{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#ffd23f);box-shadow:0 4px 10px rgba(0,0,0,.3)}

/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
/* le haut de l'écran : une seule rangée, la barre d'expérience prend la place qui reste
   (elle ne passe plus sous les pièces sur un téléphone) */
#hud > .haut{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.haut > *{pointer-events:auto}
.haut-gauche{display:flex;align-items:center;flex:0 1 auto;min-width:0}
.niveau{flex:none}
.niveau{position:relative;z-index:2;width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-family:'Lilita One';font-size:30px;color:#fff;
  text-shadow:0 2px 0 #b45309,0 0 6px rgba(0,0,0,.25);filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.niveau::before{content:'';position:absolute;inset:0;background:linear-gradient(#ffe46b,#ffb300);
  clip-path:polygon(50% 0%,61% 33%,97% 35%,68% 57%,79% 92%,50% 72%,21% 92%,32% 57%,3% 35%,39% 33%);z-index:-1}
.xp{position:relative;margin-left:-14px;width:180px;flex:0 1 auto;min-width:0;height:30px;background:rgba(59,36,18,.7);border:3px solid #fff;border-radius:999px;overflow:hidden}
.xp-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#7dd3fc,#2563eb);border-radius:999px;transition:width .5s}
.xp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.5);white-space:nowrap}
.haut-droite{display:flex;gap:8px;align-items:center;flex:none}
.pieces{display:flex;align-items:center;gap:6px;height:48px;padding:0 16px 0 6px;background:rgba(59,36,18,.7);border:3px solid #fff;border-radius:999px;color:#fff;font-size:24px;font-weight:700}
.pieces .ic{font-size:32px;line-height:1}
.pieces.vibre{animation:vibre .4s}
.petit{width:48px;height:48px;border-radius:16px;background:linear-gradient(#fff,#e9e2d0);border:3px solid #fff;font-size:24px;box-shadow:0 4px 0 #b9ab8a}
.petit:active{transform:translateY(3px);box-shadow:0 1px 0 #b9ab8a}
.petit.off{opacity:.5}
#cmd{position:absolute;left:50%;top:max(72px,calc(env(safe-area-inset-top) + 66px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);
  border:4px solid #3a86ff;border-radius:999px;padding:5px 16px;font-size:24px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.15);white-space:nowrap}
#cmd .q{font-size:16px}
#cmd .ok{color:#16a34a}
#cmd .gain{font-size:18px;color:#b45309}
.bas-gauche,.bas-droite{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:12px}
.bas-gauche{left:max(12px,env(safe-area-inset-left))}
.bas-droite{right:max(12px,env(safe-area-inset-right))}
.rond{position:relative;width:84px;height:84px;border-radius:50%;border:4px solid #fff;font-size:40px;line-height:1;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 18px rgba(0,0,0,.2);transition:transform .1s}
.rond:active{transform:translateY(4px) scale(.96)}
.rond small{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);background:#fff;color:var(--encre);font-size:13px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.rond.vert{background:linear-gradient(#7ee36b,#2fa52a)}
.rond.jaune{background:linear-gradient(#ffe46b,#ffb300)}
.rond.brun{background:linear-gradient(#a3e635,#4d7c0f);animation:respire 1s ease-in-out infinite}
.rond.vibre,.vibre{animation:vibre .45s}
@keyframes vibre{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}70%{transform:scale(.95)}}
@media (max-width:560px){
  /* téléphone : la caméra est plus loin, les bulles plus petites pour ne pas se chevaucher */
  .bulle .in{min-width:38px;height:38px;padding:0 6px;font-size:20px;border-width:2px}
  .bulle .in small{font-size:13px}
  .bulle.pad .in,.bulle.faim .in{font-size:18px}
  .bulle.lock .in,.bulle.vente .in,.bulle.info .in,.bulle.plein .in{font-size:15px;height:34px}
  .bulle.cmd .in{font-size:17px;min-height:38px;padding:2px 7px}
  .rond{width:70px;height:70px;font-size:32px}
  /* la musique et les sons restent dans ⚙️ Réglages */
  #bMusique,#bSon{display:none}
  .pieces{font-size:18px;height:40px;padding:0 12px 0 4px;gap:4px}
  .pieces .ic{font-size:24px}
  .petit{width:40px;height:40px;font-size:20px;border-radius:14px}
  .niveau{width:60px;height:60px;font-size:26px}
  .xp{height:26px;margin-left:-12px}
  .xp span{font-size:13px}
  #cmd{font-size:19px;padding:4px 12px}
}
@media (max-width:350px){
  .xp span{font-size:11px}
  .pieces{font-size:16px;padding:0 10px 0 4px}
  .pieces .ic{font-size:22px}
}

/* ── message ── */
#toast{position:fixed;left:50%;top:max(130px,calc(env(safe-area-inset-top) + 124px));transform:translateX(-50%) scale(.8);opacity:0;z-index:30;pointer-events:none;
  background:#fff;border:4px solid var(--or);border-radius:999px;padding:10px 22px;font-size:clamp(17px,2vmin + 10px,24px);font-weight:700;text-align:center;max-width:90vw;
  box-shadow:0 8px 20px rgba(0,0,0,.25);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translateX(-50%) scale(1)}
.flotte{position:fixed;z-index:20;pointer-events:none;font-weight:700;font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 8px rgba(0,0,0,.3);
  transform:translate(-50%,-50%);animation:flotte 1.2s ease-out forwards;white-space:nowrap}
@keyframes flotte{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-80px}}
.vole{position:fixed;z-index:25;pointer-events:none;font-size:36px;line-height:1;transform:translate(-50%,-50%);transition:transform .7s cubic-bezier(.45,-0.35,.6,1),opacity .7s}
.coeur{position:fixed;z-index:20;pointer-events:none;font-size:26px;animation:coeur 1s ease-out forwards}
@keyframes coeur{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-90px) scale(1.2)}}
.confetti{position:fixed;top:-20px;z-index:60;width:12px;height:18px;border-radius:3px;pointer-events:none;animation:confetti linear forwards}
@keyframes confetti{to{transform:translateY(110vh) rotate(900deg)}}

/* ── fenêtres ── */
#modal{position:fixed;inset:0;z-index:40;background:rgba(20,40,60,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.panel{position:relative;width:min(94vw,620px);max-height:88vh;display:flex;flex-direction:column;background:var(--creme);border:6px solid var(--or);border-radius:32px;
  box-shadow:0 18px 40px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ruban{align-self:center;margin-top:-30px;background:linear-gradient(#ffb14a,#ff7a1a);color:#fff;font-family:'Lilita One';font-size:clamp(24px,4vmin + 10px,36px);
  padding:6px 34px;border-radius:18px;border:4px solid #fff;box-shadow:0 5px 0 #c2410c;text-shadow:0 3px 0 rgba(0,0,0,.2);white-space:nowrap}
.panel .x{position:absolute;right:-14px;top:-14px;width:54px;height:54px;border-radius:50%;background:linear-gradient(#ff8a7a,#d63c3c);color:#fff;border:4px solid #fff;font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#mCorps{overflow-y:auto;padding:18px 18px 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:16px;padding:8px 18px;font-size:19px;font-weight:700;color:#fff;
  background:linear-gradient(#7ee36b,#2fa52a);box-shadow:0 4px 0 #1d6f1a;text-shadow:0 2px 0 rgba(0,0,0,.2);min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1d6f1a}
.btn.jaune{background:linear-gradient(#ffe46b,#ffb300);color:var(--encre);text-shadow:none;box-shadow:0 4px 0 #b45309}
.btn.rouge{background:linear-gradient(#ff8a7a,#d63c3c);box-shadow:0 4px 0 #991b1b}
.centre{text-align:center}
.grosse-etoile{font-size:110px;line-height:1;animation:tourne 1.2s ease-in-out infinite alternate}
@keyframes tourne{from{transform:rotate(-12deg) scale(1)}to{transform:rotate(12deg) scale(1.12)}}
.debloque{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.debloque div{background:#fff;border-radius:18px;padding:8px 14px;font-weight:700;border:3px solid #f1d9a8}
.debloque .em{font-size:44px;display:block}
@media (max-width:560px){
  /* fenêtre « Niveau ! » sur téléphone : plus compacte, pour voir toutes les nouveautés et le bouton */
  .grosse-etoile{font-size:64px}
  .debloque{gap:8px;margin:8px 0}
  .debloque div{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;font-size:15px;border-width:2px;border-radius:14px}
  .debloque .em{font-size:26px}
}
@media (max-width:560px) and (max-height:820px){
  .grosse-etoile{font-size:44px}
  .debloque{gap:6px;margin:6px 0}
  .debloque div{font-size:14px;padding:2px 8px 2px 5px}
  .debloque .em{font-size:22px}
}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:460px;margin:0 auto}
.parcelle{position:relative;aspect-ratio:1;border-radius:18px;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2);color:#fff;font-weight:700;font-size:15px;
  background:repeating-linear-gradient(0deg,#7b4a26 0 17%,#5e381c 17% 23%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.parcelle:active{transform:scale(.94)}
.parcelle .em{font-size:44px;line-height:1.1;text-shadow:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.parcelle .encore{position:absolute;right:5px;top:3px;font-size:18px;background:rgba(255,255,255,.85);border-radius:999px;padding:1px 4px}
.parcelle.verrou{filter:grayscale(1);opacity:.45}
.rapides{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.aide-liste{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:18px;font-weight:600;text-align:left}
.aide-liste .em{font-size:36px}

/* ── écran titre ── */
#titre{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.25),rgba(30,90,140,.55))}
#titre h1{margin:0;font-family:'Lilita One';font-size:clamp(44px,9vw,96px);line-height:.95;color:#fff;
  text-shadow:0 5px 0 #d97706,0 9px 0 #92400e,0 14px 24px rgba(0,0,0,.35)}
#titre h1 span{display:inline-block;animation:lettre 1.4s ease-in-out infinite}
@keyframes lettre{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#titre .sous{font-size:clamp(18px,3vw,26px);font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#jouer{font-family:'Lilita One';font-size:clamp(32px,6vw,52px);color:#fff;padding:14px 56px;border-radius:30px;border:6px solid #fff;
  background:linear-gradient(#7ee36b,#2fa52a);box-shadow:0 9px 0 #1d6f1a,0 16px 28px rgba(0,0,0,.3);text-shadow:0 3px 0 rgba(0,0,0,.25);animation:respire 1.2s ease-in-out infinite}
#jouer:disabled{filter:grayscale(1);animation:none;opacity:.8}
@keyframes respire{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#charge{color:#fff;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.35);min-height:1.2em}
/* ── écran titre : deux boutons, Jouer et Apprendre ── */
.choixTitre{display:flex;gap:16px 22px;flex-wrap:wrap;justify-content:center;align-items:center}
#apprendre{font-family:'Lilita One';font-size:clamp(32px,6vw,52px);color:#fff;padding:14px 40px;border-radius:30px;border:6px solid #fff;
  background:linear-gradient(#7dd3fc,#2563eb);box-shadow:0 9px 0 #1e3a8a,0 16px 28px rgba(0,0,0,.3);text-shadow:0 3px 0 rgba(0,0,0,.25);animation:respire 1.2s ease-in-out .6s infinite}
#apprendre:disabled{filter:grayscale(1);animation:none;opacity:.8}

/* ── mode Apprendre ── */
#hudA{position:fixed;inset:0;pointer-events:none;z-index:10}
#hudA > *{pointer-events:auto}
#hudA > .hautA{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.hautA > *{pointer-events:auto}
.hautA .petit{width:58px;height:58px;font-size:28px;border-radius:18px;flex:none}
.hautA .vide{width:58px;flex:none;pointer-events:none}
#aProg{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);border:4px solid #3a86ff;border-radius:999px;padding:5px 16px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
#aProg .em{font-size:26px;line-height:1}
#aProg i{display:block;width:20px;height:20px;border-radius:50%;background:#e2e8f0;border:3px solid #94a3b8}
#aProg i.p{background:#ffd23f;border-color:#f59e0b;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
#aConsigne{position:absolute;left:50%;top:max(80px,calc(env(safe-area-inset-top) + 78px));transform:translateX(-50%);width:max-content;max-width:min(92vw,760px);
  background:#fff;border:4px solid var(--or);border-radius:24px;padding:8px 18px;font-size:clamp(17px,1.6vmin + 12px,24px);font-weight:700;text-align:center;line-height:1.3;
  box-shadow:0 6px 0 rgba(0,0,0,.15)}
#aConsigne:active{transform:translateX(-50%) translateY(3px)}
#aBulles{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
/* des bulles plus grosses que dans « Jouer » : ce sont les boutons des petits doigts */
.bulle.a .in{min-width:60px;height:60px;padding:0 12px;font-size:34px;cursor:pointer}
.bulle.a.caisseA .in{border-color:#fde68a}
.bulle.a.panneau .in{background:linear-gradient(#ffffff,#fff3c4);border-color:#ffd23f;gap:6px;font-size:32px}
.bulle.a.panneau .in::after{border-top-color:#ffd23f}
.bulle.a.panneau.petit .in{min-width:50px;height:50px;font-size:26px}
.etoilesA{font-size:20px;letter-spacing:-1px;white-space:nowrap}
.etoilesA i{font-style:normal;filter:grayscale(1);opacity:.35}
.bulle.a.cmdA .in{height:auto;min-height:60px;padding:6px 12px;border-color:#3a86ff;gap:8px}
.bulle.a.cmdA .in::after{border-top-color:#3a86ff}
.bulle.a.cmdA .em{font-size:34px}
.bulle.a.cmdA b{font-family:'Lilita One';font-weight:400;font-size:38px;color:#1d4ed8;line-height:1}
.cases{display:flex;gap:4px}
.cases.dix{display:grid;grid-template-columns:repeat(5,auto)}
.cases i{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:3px dashed #93c5fd;font-style:normal;font-size:18px}
.cases i.p{border:3px solid #22c55e;background:#dcfce7;animation:pop .25s}
.lot{display:inline-flex;align-items:center;gap:4px}
.lot + .lot{margin-left:6px;padding-left:10px;border-left:3px solid #e2e8f0}
.lot .ok{color:#16a34a;font-size:30px}
.lot small{font-size:15px;letter-spacing:-3px}
.bulle.a.faimA .in{border-color:#f97316;font-size:30px}
.bulle.a.faimA .in::after{border-top-color:#f97316}
/* syllabes : l'image du mot sur le chevalet, les images à choisir, les applaudissements de chaque chemin */
.bulle.a.carteA .in{height:auto;min-width:104px;min-height:104px;font-size:70px;border-radius:26px;border-color:#a855f7;padding:4px 14px}
.bulle.a.carteA .in::after{border-top-color:#a855f7}

/* Old MacDonald — air traditionnel du domaine public, joué tout doux */
const NOTE = { G3: 196, C3: 131, G4: 392, A4: 440, C5: 523, D5: 587, E5: 659 };
const AIR = [['C5', 1], ['C5', 1], ['C5', 1], ['G4', 1], ['A4', 1], ['A4', 1], ['G4', 2], ['E5', 1], ['E5', 1], ['D5', 1], ['D5', 1], ['C5', 3], ['G4', 1],
  ['C5', 1], ['C5', 1], ['C5', 1], ['G4', 1], ['A4', 1], ['A4', 1], ['G4', 2], ['E5', 1], ['E5', 1], ['D5', 1], ['D5', 1], ['C5', 4]];
let musiqueT = 0, musiqueI = 0, musiqueMinuteur = null;
function note(A, f, t, v, dur, type) {
  const o = A.createOscillator(), g = A.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(A.destination); o.start(t); o.stop(t + dur + .05);
}
function planifierMusique() {
  const A = ac(), noire = 60 / 128;
  while (musiqueT < A.currentTime + .4) {
    const [n, d] = AIR[musiqueI % AIR.length];
    note(A, NOTE[n], musiqueT, .045, Math.min(d * noire, .5), 'triangle');
    for (let k = 0; k < d; k++) note(A, (musiqueI + k) % 2 ? NOTE.G3 : NOTE.C3, musiqueT + k * noire, .05, .3, 'sine');
    musiqueT += d * noire;
    musiqueI++;
  }
}
function majMusique() {
  clearInterval(musiqueMinuteur);
  $('#bMusique').classList.toggle('off', !S.musique);
  if (!S.musique || !AC) return;
  musiqueT = Math.max(musiqueT, AC.currentTime + .1);
  musiqueMinuteur = setInterval(planifierMusique, 150);
}

function rectArrondi(w, d, r) {

  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);

  roue.add(new THREE.Mesh(geo('roueG', () => new THREE.TorusGeometry(2.4, .08, 6, 28)), mat('#ef4444')));
  for (let i = 0; i < 8; i++) { const r = P(Bx(.06, 4.8, .06), '#f8fafc', 0, 0, 0, true); r.rotation.z = i * Math.PI / 8; roue.add(r); }

  for (const x of [-2.3, 2.3]) for (const z of [-.55, .55]) g.add(P(Bx(.14, .8, .14), '#8a5a3c', x, .4, z));
  for (let i = 0; i < 7; i++) g.add(P(Bx(.7, .5, .06), i % 2 ? '#ffffff' : '#22c55e', -2.1 + i * .7, .6, .72, true));
  for (const x of [-2.4, 2.4]) g.add(P(Cy(.06, .06, 2.5, 6), '#8a5a3c', x, 1.25, -.62));
  g.add(P(Bx(4.8, .03, .03), '#ffffff', 0, 2.35, -.62, true));
  for (let i = 0; i < 10; i++) {
    const f = P(Pr(.32, .38, .03), ['#ef4444', '#facc15', '#3b82f6', '#22c55e'][i % 4], -2.16 + i * .48, 2.34, -.62, true);
    f.rotation.z = Math.PI; g.add(f);
  }
  /* un petit panneau suspendu à la guirlande : une boule dorée par agrandissement */
  const etoiles = new THREE.Group(); etoiles.position.set(0, 2.62, -.62); g.add(etoiles);
  g.userData.etoiles = etoiles;
  /* l'étagère du fond, plus haute, pour les produits de la nouvelle île */
  const etagere = grp(P(Bx(4.5, .1, .8), '#b5793e', 0, 1.5, -1.1));
  for (const x of [-2.15, 2.15]) for (const z of [-.75, -1.45]) etagere.add(P(Bx(.12, 1.5, .12), '#8a5a3c', x, .75, z));
  g.add(etagere);
  g.userData.etagere = etagere;
  g.userData.caisses = ETAL_PRODUITS.map((k, i) => {
    const haut = i >= ETAL_RANG1, cible = haut ? etagere : g;
    const x = haut ? -1.65 + (i - ETAL_RANG1) * .66 : -1.98 + i * .66, y = haut ? .5 : 0, z = haut ? -1.1 : 0, d = haut ? .7 : 1.04;
    cible.add(P(Bx(.6, .28, d), '#c98b4b', x, 1.06 + y, z), P(Bx(.64, .06, .08), '#8a5a3c', x, 1.2 + y, z + d / 2 - .02, true));
    const etiquette = grp(P(Bx(.46, .42, .05), '#fff8e7', 0, 0, 0, true)), m = fabMini(k);
    m.scale.setScalar(1.3); m.position.z = .08; etiquette.add(m);
    etiquette.position.set(x, 1.45 + y, z + d / 2 + .04); etiquette.rotation.x = -.35; cible.add(etiquette);
    const contenu = new THREE.Group(); contenu.position.set(x, 1.3 + y, z - .05); cible.add(contenu);
    return contenu;
  });
  return g;
}

function fabFermier(look) {
  const L = Object.assign({ chemise: '#dc2626', salopette: '#1d4ed8', cheveux: '#7a4a24', peau: '#e8b98f', couettes: false }, look);
  const g = new THREE.Group();
  const jambe = s => { const p = new THREE.Group(); p.position.set(s * .15, .7, 0); p.add(P(Cy(.11, .11, .7, 6), L.salopette, 0, -.35, 0), P(Bx(.18, .12, .3), '#3b2412', 0, -.66, .05)); return p; };
  const jg = jambe(-1), jd = jambe(1);
  const corps = new THREE.Group();
  corps.add(P(Cy(.34, .36, .9, 10), L.salopette, 0, 1.1, 0), P(Cy(.33, .35, .5, 10), L.chemise, 0, 1.75, 0),
    P(Bx(.08, .5, .05), L.salopette, -.18, 1.75, .32, true), P(Bx(.08, .5, .05), L.salopette, .18, 1.75, .32, true),
    P(Sp(.3, 10, 8), L.peau, 0, 2.25, 0), P(Sp(.24, 8, 6), L.cheveux, 0, 2.08, .1),
    P(Cy(.62, .62, .05, 14), '#e9c46a', 0, 2.5, 0), P(Cy(.3, .34, .32, 12), '#e9c46a', 0, 2.68, 0), P(Cy(.35, .35, .09, 12), L.cheveux, 0, 2.57, 0, true),
    P(Sp(.045, 5, 4), '#111', -.11, 2.3, .27, true), P(Sp(.045, 5, 4), '#111', .11, 2.3, .27, true),
    P(Bx(.6, .5, .3), '#b07a45', 0, 1.45, -.45), P(Bx(.64, .08, .34), '#8a5a3c', 0, 1.71, -.45, true));
  /* le sac à dos grossit et une étoile dorée brille sur le chapeau au niveau 2 */
  const sac = new THREE.Group(); sac.position.set(0, 1.2, -.45);
  for (const m of corps.children.slice(11, 13)) { m.position.y -= 1.2; m.position.z = 0; sac.add(m); }
  corps.add(sac);
  const etoile = P(Sp(.12, 8, 6), '#ffd23f', 0, 2.9, 0, true); etoile.visible = false; corps.add(etoile);
  /* l'éleveuse : pas de barbe, deux couettes et des rubans */
  if (L.couettes) {
    corps.children[5].visible = false;
    for (const s of [-1, 1]) corps.add(P(Sp(.15, 7, 5), L.cheveux, s * .34, 2.12, -.08), P(Sp(.06, 5, 4), '#facc15', s * .3, 2.26, -.06, true));
  }
  const bras = s => { const p = new THREE.Group(); p.position.set(s * .4, 1.95, 0); p.rotation.z = s * .3; p.add(P(Cy(.08, .08, .6, 5), L.chemise, 0, -.3, 0)); return p; };
  const bg = bras(-1), bd = bras(1);
  corps.add(bg, bd);
  const pile = new THREE.Group(); pile.position.set(0, 1.75, -.45);
  corps.add(pile);
  g.add(jg, jd, corps);
  g.userData = { jg, jd, bg, bd, corps, pile, sac, etoile };
  return g;
}

const TAILLE_PAD = 2.4;
function remplirPad(j, k) { j.scale.z = Math.max(.001, k); j.position.z = -((TAILLE_PAD - .15) / 2) * (1 - k); }
function fabPad(couleur = '#4ade80') {
  const g = new THREE.Group(), L = TAILLE_PAD;
  for (let s = 0; s < 4; s++) {
    const cote = new THREE.Group(); cote.rotation.y = s * Math.PI / 2;
    for (let k = 0; k < 4; k++) cote.add(P(Bx(.42, .05, .1), '#ffffff', -L / 2 + .3 + k * .6, .05, -L / 2, true));
    g.add(cote);
  }
  const fond = new THREE.Mesh(Bx(L - .15, .02, L - .15), new THREE.MeshLambertMaterial({ color: couleur, transparent: true, opacity: .35 }));
  fond.position.y = .03; g.add(fond);
  const jauge = P(Bx(L - .15, .03, L - .15), couleur, 0, .04, 0, true); jauge.castShadow = false; jauge.scale.z = .001; g.add(jauge);
  g.userData.jauge = jauge;
  return g;
}
function fabFleche() {

function entite(obj, opts) {
  const e = Object.assign({ obj }, opts);
  obj.userData.ent = e;
  cibles.push(obj); entites.push(e);
  if (e.etatBulle) e.el = creerBulle(e);
  return e;
}
function retirerEntite(e) {
  const i = entites.indexOf(e); if (i >= 0) entites.splice(i, 1);
  const j = cibles.indexOf(e.obj); if (j >= 0) cibles.splice(j, 1);
  if (e.el) e.el.remove();
  scene.remove(e.obj);
}

}
function majPieces() {

/* ══════════════════════════════════════════════════════════
   LA PILE SUR LE DOS DE ROULLIEEE
   ══════════════════════════════════════════════════════════ */
let enVolPile = 0, sigPile = '';
function majPile() {
  const n = Math.max(0, S.porte.length - enVolPile);
  const sig = S.porte.slice(0, n).join(',');
  if (sig === sigPile) return;
  sigPile = sig;
  while (pileGroupe.children.length) pileGroupe.remove(pileGroupe.children[0]);
  S.porte.slice(0, n).forEach((k, i) => { const m = fabMini(k); m.position.y = i * .27 + .12; pileGroupe.add(m); });
  hauteurPile = n;
}
const tmpV = new THREE.Vector3();
function hautDePile() { tmpV.set(0, S.porte.length * .27 + .2, 0); return pileGroupe.localToWorld(tmpV.clone()); }
function plein() { return S.porte.length >= S.capacite; }
function prendre(k, depart) {
  S.porte.push(k); enVolPile++;
  lancer(fabMini(k), depart, hautDePile, .38, () => { enVolPile--; majPile(); SFX.pile(); });
}
function deposer(k, versFn) {
  const i = S.porte.lastIndexOf(k);
  if (i < 0) return false;
  S.porte.splice(i, 1);
  const depart = hautDePile();
  majPile(); SFX.pose();
  lancer(fabMini(k), depart, versFn, .38);

}

/* ══════════════════════════════════════════════════════════
   CE QUE ROULLIEEE FAIT EN PASSANT
   Un objet à la fois, toutes les 0,12 s : on voit chaque objet voler.
   ══════════════════════════════════════════════════════════ */
let cadence = 0, cadencePad = 0, alertePleinT = 0;
function alertePlein() {
  if (maintenant() < alertePleinT) return;
  alertePleinT = maintenant() + 5000;
  SFX.non();
  message('🧺 Ton panier est plein ! Va livrer le camion 🚚 ou vendre à la grange 🪙', 'Ton panier est plein !');
}
function pos3(x, z, y = .6) { return new THREE.Vector3(x, y, z); }
/* rayons d'action, larges : un enfant n'a pas à viser au centimètre */
const RAYON_AUGE = 2.6, PORTEE_CAMION = 2.4, DEMI_PAD = TAILLE_PAD / 2;
/* le camion prend la marchandise de n'importe quel côté : derrière,
   à gauche ou à droite (distance au rectangle du camion, pas à un point) */
/* L'engrais ne part jamais tout seul dans un champ : c'est l'enfant qui
   décide. Debout sur un champ qui pousse, avec de l'engrais sur le dos,
   le bouton 🪴 apparaît ; le toucher rend le champ mûr d'un coup. */
let champQuiPousse = -1, boutonEngrais = false;
function majBoutonEngrais() {
  const ok = champQuiPousse >= 0 && S.porte.includes('engrais');
  if (ok !== boutonEngrais) { boutonEngrais = ok; $('#bEngrais').classList.toggle('cache', !ok); if (ok) SFX.pop(); }
}
function mettreEngrais() {
  const i = champQuiPousse, c = S.champs[i];
  if (i < 0 || !c || !c.c || maintenant() >= c.t1) return;
  const [fx, fz] = POS_CHAMPS[i];
  if (!deposer('engrais', () => pos3(fx, fz, .5))) return;
  c.t1 = maintenant(); sauver();
  SFX.plop(); vibrer(30); coeurs(eChamps[i].obj, 1.2, ['✨', '🌱', '💚']); flotter(eChamps[i].obj, '🪴 Pousse !', 1.6);
  champQuiPousse = -1; majBoutonEngrais();
}
function presDuCamion(p) {
  const dx = Math.max(Math.abs(p.x - camion.position.x) - .85, 0), dz = Math.max(Math.abs(p.z - camion.position.z) - 2, 0);
  return Math.hypot(dx, dz) < PORTEE_CAMION;
}
/* même principe pour l'étal : n'importe où le long de la table */
function presDeLEtal(p) {
  const dx = Math.max(Math.abs(p.x - ETAL.x) - .8, 0), dz = Math.max(Math.abs(p.z - ETAL.z) - 2.5, 0);
  return Math.hypot(dx, dz) < 2.4;
}
function zones(dt) {
  const p = joueur.position, t = maintenant();
  cadencePad -= dt;
  if (cadencePad <= 0) { cadencePad = .05; payerPads(); }
  cadence -= dt;
  if (cadence > 0) return;
  cadence = .12;
  champQuiPousse = -1;

  /* champs : semer ou récolter */
  for (let i = 0; i < S.champsAchetes; i++) {
    const [fx, fz] = POS_CHAMPS[i];
    if (Math.abs(p.x - fx) > DEMI_CHAMP + .1 || Math.abs(p.z - fz) > DEMI_CHAMP + .1) continue;
    const c = S.champs[i];
    if (!c.c) { const g = c.prevu || 'ble'; if (S.niveau >= CULTURES[g].niv) planter(i, g); return; }
    if (t < c.t1) { champQuiPousse = i; return; }
    if (plein()) { alertePlein(); return; }
    prendre(cueillir(i), pos3(fx + rand(-.8, .8), fz + rand(-.8, .8), .8));
    gagnerXP(1);
    return;
  }
  /* le verger : sous un pommier aux pommes rouges, elles tombent dans la hotte */
  for (let i = 0; i < S.pommiers; i++) {
    const [x, z] = VERGER.arbres[i], pm = S.pommes[i];
    if (Math.hypot(p.x - x, p.z - z) > RAYON_AUGE || t < pm.t1) continue;
    if (plein()) { alertePlein(); return; }
    pm.reste--;
    if (pm.reste <= 0) { pm.t1 = t + VERGER.duree * 1000; pm.reste = VERGER.recolte; secouer(ePommiers[i].obj); vibrer(20); }
    prendre('pomme', pos3(x + rand(-1, 1), z + .8, 2.6));
    gagnerXP(1); sauver();
    return;
  }
  /* les stands : on y dépose le lait ou la laine, on reprend les produits finis */
  for (const [id, A] of Object.entries(ATELIERS)) {
    const T = S.ateliers[id];
    if (!T.achete || Math.hypot(p.x - A.x, p.z - (A.z + 2.6)) > RAYON_AUGE) continue;
    const ent = entreesDe(A).find(([k, c]) => T[c] < ENTREE_MAX && S.porte.includes(k));
    if (ent) {
      const ou = pos3(A.x - .85, A.z, 2);
      if (deposer(ent[0], () => ou)) { T[ent[1]]++; sauver(); }
      return;
    }
    if (T.sortie > 0) {
      if (plein()) { alertePlein(); return; }
      T.sortie--;
      prendre(A.sortie, pos3(A.x + .75, A.z + .55, 1.3));
      gagnerXP(2); sauver();
      return;
    }
  }
  /* auges et caisses */
  for (const [id, E] of Object.entries(ENCLOS)) {
    const K = ANIMAUX[E.espece];
    if (!S.animaux.some(a => a.esp === E.espece)) continue;
    if (Math.hypot(p.x - E.auge[0], p.z - E.auge[1]) < RAYON_AUGE && S.auges[id] < AUGE_MAX && S.porte.includes(K.mange)) {
      const ou = pos3(E.auge[0] + rand(-.5, .5), E.auge[1], .5);
      if (deposer(K.mange, () => ou)) { S.auges[id]++; sauver(); }
      return;
    }
    if (Math.hypot(p.x - E.caisse[0], p.z - E.caisse[1]) < RAYON_AUGE && S.caisses[id] > 0) {
      if (plein()) { alertePlein(); return; }
      S.caisses[id]--;
      prendre(K.donne, pos3(E.caisse[0], E.caisse[1], .8));
      gagnerXP(1); sauver();
      return;
    }
  }
  /* le camion prend ce que demande la commande */
  const c = S.commande;
  if (c && !eCamion.parti && presDuCamion(p)) {
    const it = c.items.find(i => i.fait < i.n && S.porte.includes(i.k));
    if (it) {
      const ou = new THREE.Vector3(rand(-.5, .5), 1.2, -.6);
      deposer(it.k, () => camion.localToWorld(ou.clone()));
      it.fait++;
      majCharge();
      if (c.items.every(i => i.fait >= i.n)) livrer();
      sauver(); majHud();
      return;
    }
    if (c.items.some(i => i.fait < i.n) && S.porte.length === 0) message('🚚 Le camion attend : ' + c.items.filter(i => i.fait < i.n).map(i => ITEMS[i.k].e + ' ' + (i.n - i.fait)).join('  '));
  }
  /* l'étal : ce que le camion ne prend pas tout de suite y est rangé,
     le camion suivant viendra s'y servir */
  if (S.etal.achete && presDeLEtal(p)) {
    const k = [...S.porte].reverse().find(k => ETAL_PRODUITS.includes(k) && S.etal.stock[k] < placesEtal());
    if (k) {
      const ou = etal.userData.caisses[ETAL_PRODUITS.indexOf(k)].localToWorld(new THREE.Vector3(0, .2, 0));
      if (deposer(k, () => ou)) { S.etal.stock[k]++; sauver(); }
      return;
    }
  }
  for (const [id, R] of Object.entries(RESERVES)) {
    const Rs = S.reserves[id];
    if (!Rs.achete || !presDeReserve(R, p)) continue;
    const k = [...S.porte].reverse().find(k => R.produits.includes(k) && Rs.stock[k] < R.places);
    if (!k) continue;
    const ou = eReserves[id].obj.userData.bacs[R.produits.indexOf(k)].localToWorld(new THREE.Vector3(0, .1, 0));
    if (deposer(k, () => ou)) { Rs.stock[k]++; sauver(); }
    return;
  }
  /* vente à la grange */
  if (Math.abs(p.x - VENTE[0]) < DEMI_PAD && Math.abs(p.z - VENTE[1]) < DEMI_PAD && S.porte.length) {
    const k = S.porte[S.porte.length - 1], v = ITEMS[k].val;
    deposer(k, () => pos3(VENTE[0], VENTE[1] - 1.6, 1.2));
    S.pieces += v;
    if (Math.random() < .5) SFX.piece();
    flotter(padVente, '+' + v + ' 🪙', 1.2);
    sauver();
  }
}

/* ── champs ── */
/* prend une poignée dans un champ mûr (Roullieee ou le cultivateur) ;
   le champ redevient de la terre quand tout est ramassé */
function cueillir(i) {
  const c = S.champs[i], k = c.c;
  c.reste = (c.reste || recolteDe(k)) - 1;
  if (c.reste <= 0) { S.champs[i] = { c: null, t0: 0, t1: 0, reste: 0, prevu: c.prevu }; poserPlantes(eChamps[i]); rebond(eChamps[i].obj); vibrer(20); }
  sauver();
  return k;
}
function poserPlantes(e) {
  if (e.plantes) { e.obj.remove(e.plantes); e.plantes = null; e.tetes = []; }
  const p = S.champs[e.i];
  if (!p.c) return;
  const f = fabPlantes(p.c);
  e.plantes = f.g; e.tetes = f.tetes; e.mur = false;
  e.obj.add(f.g);
}
/* le panneau du champ montre la culture prévue */
function majEtiquette(e) {
  const g = e.etiquette;
  while (g.children.length) g.remove(g.children[0]);
  const m = fabMini(S.champs[e.i].prevu || 'ble'); m.scale.setScalar(1.9); g.add(m);
}
function majChamps() { eChamps.forEach(e => { e.obj.visible = e.i < S.champsAchetes; majEtiquette(e); }); }
majChamps();
eChamps.forEach(poserPlantes);
function planter(i, c) {
  const C = CULTURES[c], t = maintenant();
  S.champs[i] = { c, t0: t, t1: t + C.duree * 1000, reste: recolteDe(c), prevu: S.champs[i].prevu || c };
  poserPlantes(eChamps[i]);
  SFX.plop(); rebond(eChamps[i].obj);
  sauver();
}

/* ── commandes et camion ── */
function nouvelleCommande(facile) {
  const dispo = Object.keys(CULTURES).filter(c => CULTURES[c].niv <= S.niveau);
  new Set(S.animaux.map(a => a.esp)).forEach(esp => dispo.push(ANIMAUX[esp].donne));
  if (S.pommiers) dispo.push('pomme');
  for (const [id, A] of Object.entries(ATELIERS)) if (S.ateliers[id].achete) dispo.push(A.sortie);
  const types = facile ? ['ble'] : melange(dispo).slice(0, Math.min(dispo.length, randi(1, S.niveau >= 3 ? 3 : 2)));
  /* les produits transformés valent cher : on en demande peu */
  const items = types.map(k => ({ k, n: facile ? 3 : Object.values(ATELIERS).some(A => A.sortie === k) ? randi(1, 2) : randi(2, S.niveau < 3 ? 4 : 5), fait: 0 }));
  const val = items.reduce((s, i) => s + ITEMS[i.k].val * i.n, 0);
  const qui = pick(CLIENTS);
  return { items, pieces: Math.round(val * 1.6), xp: Math.max(3, Math.round(val / 2)), qui: qui[0], nom: qui[1] };
}
if (!S.commande) { S.commande = nouvelleCommande(true); sauver(); }
function majCharge() {
  const ch = camion.userData.charge;
  while (ch.children.length) ch.remove(ch.children[0]);
  if (!S.commande || eCamion.parti) return;
  let n = 0;
  S.commande.items.forEach(i => { for (let k = 0; k < i.fait; k++, n++) { const m = fabMini(i.k); m.position.set((n % 3 - 1) * .45, Math.floor(n / 3) * .25, (Math.floor(n / 3) % 2) * .3 - .4); ch.add(m); } });
}
majCharge();
function livrer() {
  const c = S.commande;
  S.pieces += c.pieces;
  gagnerXP(c.xp);
  S.commande = nouvelleCommande();
  sauver();
  SFX.achat(); vibrer(40);
  message(`🚚 Bravo ! ${c.qui} ${c.nom} te donne ${c.pieces} 🪙 !`, `Bravo ! Commande livrée !`);
  flotter(camion, '+' + c.pieces + ' 🪙', 3.5);
  setTimeout(() => flotter(camion, '+' + c.xp + ' ⭐', 2.8), 300);
  for (let i = 0; i < Math.min(8, Math.ceil(c.pieces / 4)); i++) setTimeout(() => versHud('🪙', camion, 2.5, '#bourse', () => SFX.piece()), 200 + i * 110);
  confettis(40);
  const e = eCamion;
  e.parti = true;
  setTimeout(() => {
    SFX.klaxon(); setTimeout(SFX.vroum, 200);
    animer(2.4, k => { camion.position.z = 12.4 + k * k * 40; }, () => {
      camion.visible = false;
      setTimeout(() => {
        camion.visible = true; camion.rotation.y = Math.PI;
        majHud();
        animer(2.4, k => { const s = 1 - (1 - k) * (1 - k); camion.position.z = 52.4 - s * 40; }, () => {
          animer(.6, k => { camion.rotation.y = Math.PI * (1 - k); }, () => { e.parti = false; majCharge(); majHud(); SFX.klaxon(); });
        });
      }, 1800);
    });
  }, 500);
  majHud();
}
/* Le camion garé se sert sur l'étal, un produit à la fois : on voit
   chaque œuf, chaque pull sauter des cagettes jusque dans la benne. */
let cadenceEtal = 0;
function majEtal(dt) {
  const st = S.etal.stock, sig = ETAL_PRODUITS.map(k => st[k]).join(',');
  if (sig !== eEtal.sig) {
    eEtal.sig = sig;
    etal.userData.caisses.forEach((g, i) => {
      while (g.children.length) g.remove(g.children[0]);
      for (let j = 0; j < Math.min(st[ETAL_PRODUITS[i]], 9); j++) {
        const m = fabMini(ETAL_PRODUITS[i]); m.scale.setScalar(.85);
        m.position.set(0, Math.floor(j / 3) * .22, (j % 3 - 1) * .32); g.add(m);
      }
    });
  }
  for (const [id, R] of Object.entries(RESERVES)) {
    const e = eReserves[id], sr = S.reserves[id].stock, sigR = R.produits.map(k => sr[k]).join(',');
    if (sigR === e.sig) continue;
    e.sig = sigR;
    e.obj.userData.bacs.forEach((g, i) => {
      while (g.children.length) g.remove(g.children[0]);
      for (let j = 0; j < Math.min(sr[R.produits[i]], 9); j++) {
        const m = fabMini(R.produits[i]); m.scale.setScalar(.8);
        m.position.set((j % 3 - 1) * .26, Math.floor(j / 3) * .2, 0); g.add(m);
      }
    });
  }
  cadenceEtal -= dt;
  const c = S.commande;
  if (cadenceEtal > 0 || !c || eCamion.parti) return;
  /* d'abord l'étal, puis le silo et l'entrepôt */
  let it = S.etal.achete && c.items.find(i => i.fait < i.n && st[i.k] > 0), depart;
  if (it) { st[it.k]--; depart = etal.userData.caisses[ETAL_PRODUITS.indexOf(it.k)].localToWorld(new THREE.Vector3(0, .3, 0)); }
  else for (const [id, R] of Object.entries(RESERVES)) {
    const Rs = S.reserves[id];
    if (!Rs.achete) continue;
    it = c.items.find(i => i.fait < i.n && Rs.stock[i.k] > 0);
    if (!it) continue;
    Rs.stock[it.k]--;
    depart = eReserves[id].obj.userData.bacs[R.produits.indexOf(it.k)].localToWorld(new THREE.Vector3(0, .3, 0));
    break;
  }
  if (!it) return;
  cadenceEtal = .35;
  it.fait++;
  const ou = new THREE.Vector3(rand(-.5, .5), 1.2, -.6);
  lancer(fabMini(it.k), depart, () => camion.localToWorld(ou.clone()), .5);
  SFX.pose();
  majCharge();
  if (c.items.every(i => i.fait >= i.n)) livrer();
  sauver(); majHud();
}

let padsPrets = false;

  for (const [id, e] of pads) if (!ids.has(id)) { retirerEntite(e); pads.delete(id); }
  for (const def of l) {
    let e = pads.get(def.id);
    if (!e) {
      const o = poser(fabPad(), def.x, def.z);
      e = entite(o, { type: 'pad', def, haut: 1.3, vers: () => [e.def.x, e.def.z],
        etatBulle: () => {
          if (S.niveau < e.def.niv) return { t: e.def.e + ' 🔒<small>Niv. ' + e.def.niv + '</small>', c: 'lock' };
          /* sablier pendant les 1,5 s d'attente : « ne bouge plus… » */
          if (e.dessus && padJusteAchete !== e.def.id && (e.immobile || 0) < ATTENTE_ACHAT) return { t: e.def.e + ' ⏳', c: 'pad sur' };
          return { t: e.def.e + ' <small>🪙' + (e.def.prix - (S.pads[e.def.id] || 0)) + '</small>', c: 'pad' + (e.dessus ? ' sur' : '') };
        } });
      pads.set(def.id, e);
      if (padsPrets) { apparaitre(o); coeurs(o, 1, ['✨', '⭐']); }
    }
    e.def = def;
    e.obj.position.set(def.x, 0, def.z);
    const k = (S.pads[def.id] || 0) / def.prix, j = e.obj.userData.jauge;
    remplirPad(j, k);
  }

}
/* après un achat, il faut sortir du carré avant d'en racheter un :
   sinon un enfant qui reste planté dessus vide sa bourse sans le vouloir */
let padJusteAchete = null;
/* On n'achète qu'en restant immobile sur le carré : traverser un carré
   en courant vers autre chose ne dépense rien. */
const ATTENTE_ACHAT = 1.5;
function payerPads() {
  const p = joueur.position;
  for (const e of pads.values()) {
    const d = e.def, dessus = Math.abs(p.x - d.x) < DEMI_PAD && Math.abs(p.z - d.z) < DEMI_PAD;
    e.dessus = dessus;
    if (!dessus) { e.immobile = 0; if (padJusteAchete === d.id) padJusteAchete = null; continue; }
    if (padJusteAchete === d.id) return;
    e.immobile = vitesseJoueur < .3 ? (e.immobile || 0) + .05 : 0;
    if (e.immobile < ATTENTE_ACHAT) return;
    if (S.niveau < d.niv) { message(`🔒 Il faut être au niveau ${d.niv} !`); return; }
    const deja = S.pads[d.id] || 0;
    if (S.pieces <= 0) { message(`🪙 Il manque ${d.prix - deja} pièces !`, 'Il manque des pièces !'); return; }
    const pas = Math.min(Math.max(1, Math.ceil(d.prix / 25)), S.pieces, d.prix - deja);
    S.pieces -= pas;
    S.pads[d.id] = deja + pas;
    if ((S.pads[d.id] | 0) % 2 === 0) { lancer(fabPiece(), hautDePile(), () => pos3(d.x, d.z, .1), .3); SFX.piece(); }
    const k = S.pads[d.id] / d.prix, j = e.obj.userData.jauge;
    remplirPad(j, k);
    if (S.pads[d.id] >= d.prix) {
      delete S.pads[d.id];
      padJusteAchete = d.id;
      SFX.achat(); confettis(40); vibrer(50);
      d.fait();
      syncPads(); majHud();
    }
    sauver();
    return;
  }
}

const FAB_BETE = { poule: fabPoule, vache: fabVache, cochon: fabCochon, mouton: fabMouton, chevre: fabChevre, abeille: fabAbeille };
const ENCLOS_DE = Object.fromEntries(Object.entries(ENCLOS).map(([id, E]) => [E.espece, id]));
function placeLibre(E, marge = 1) { return new THREE.Vector3(E.x + rand(-E.w / 2 + marge, E.w / 2 - marge), 0, E.z + rand(-E.d / 2 + marge, E.d / 2 - marge)); }
function creerBete(a, apparition) {

const angle = (a, b, k) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * k; };
function mangeoire(E) { return new THREE.Vector3(E.auge[0] + rand(-.5, .5), 0, clamp(E.auge[1], E.z - E.d / 2 + .8, E.z + E.d / 2 - .8)); }
function bougerBete(e, dt, t) {
  const a = e.a, K = e.K, E = e.E, id = e.id, p = e.obj.position, now = maintenant();
  /* produit prêt : il saute dans la caisse */
  if (a.pret && now >= a.pret && S.caisses[id] < CAISSE_MAX) {
    a.pret = 0; S.caisses[id]++; sauver();
    lancer(fabMini(K.donne), pos3(p.x, p.z, 1), () => pos3(E.caisse[0], E.caisse[1], .9), .7);
    rebond(e.obj);
  }
  /* faim et de quoi manger : direction l'auge */
  if (!a.pret && S.auges[id] > 0 && !e.versAuge) { e.versAuge = true; e.cible = mangeoire(E); e.attente = 0; }
  if (e.attente > 0) {
    e.attente -= dt;
    if (a.esp === 'poule') e.corps.rotation.x = (t * 1.7 + a.id) % 1.6 < .3 ? .45 : 0;
    p.y = 0;
  } else {
    const dx = e.cible.x - p.x, dz = e.cible.z - p.z, d = Math.hypot(dx, dz);
    if (d < .2) {
      if (e.versAuge) {
        e.versAuge = false;
        if (!a.pret && S.auges[id] > 0) {
          S.auges[id]--; a.pret = now + K.duree * 1000; sauver();
          SFX.miam(); coeurs(e.obj, 1.6); setTimeout(() => SFX[a.esp](), 250);
          e.corps.rotation.x = .3; e.attente = 1.2;
        }
      } else e.attente = rand(1.5, 5);
      e.cible = placeLibre(E);
    } else {
      const s = Math.min(d, K.vitesse * (e.versAuge ? 1.8 : 1) * dt);
      p.x += dx / d * s; p.z += dz / d * s;
      e.obj.rotation.y = angle(e.obj.rotation.y, Math.atan2(dx, dz), .12);
      p.y = a.esp === 'poule' ? Math.abs(Math.sin(t * 12 + a.id)) * .12 : Math.abs(Math.sin(t * 6 + a.id)) * .05;
      e.corps.rotation.x = 0;
    }
  }
  if (a.esp === 'mouton') {
    const k = !a.pret ? .72 : clamp(1 - (a.pret - now) / (K.duree * 1000), 0, 1) * .45 + .72;
    e.corps.userData.laine.scale.setScalar(k);
  }
  /* les abeilles volent au-dessus de l'enclos en battant des ailes */
  if (a.esp === 'abeille') {
    p.y = 1.1 + Math.sin(t * 3 + a.id) * .2;
    e.corps.userData.ailes.forEach((w, i) => { w.rotation.z = Math.sin(t * 40 + i) * .6 * (i ? -1 : 1); });
  }
}

   vides. Les bêtes qui attendent depuis le plus longtemps passent

   la grange. Ils sèment d'abord les champs vides et ne récoltent que
   pour les bêtes : le reste des champs est laissé aux commandes de
   l'enfant. L'éleveuse vide les caisses presque pleines et porte tout

   choisit la caisse qui rapporte le plus pour le chemin à faire (une

    if (b && !(window.speechSynthesis && speechSynthesis.speaking)) { rebond(b.obj); SFX[b.esp](); }
  }
  /* l'eau de la fontaine (Où est Pompon ?) */
  if (sceneCourante === 'pompon') mondeA.children.forEach(o => o.userData.gouttes && o.userData.gouttes.forEach(g => {
    const k = (t * .8 + g.userData.t) % 1;
    g.position.set(Math.cos(g.userData.a) * k * .9, 2.2 + Math.sin(k * Math.PI) * .6 - k * 1.5, Math.sin(g.userData.a) * k * .9);
  }));
  /* la fumée de la cheminée, comme dans « Jouer » */
  if (sceneCourante === 'ferme' && maisonA) maisonA.userData.fumee.forEach(s => {
    s.userData.t = (s.userData.t + dt * .25) % 1;
    const k = s.userData.t;
    s.position.set(1.4 + Math.sin(k * 5) * .2, 5.5 + k * 3, -.6 - k * .5); s.scale.setScalar(.4 + k * 1.1); s.material.opacity = .85 * (1 - k);
  });
  if (flecheA.visible) { flecheA.position.y = flecheA.userData.y + Math.abs(Math.sin(t * 4)) * .6; flecheA.rotation.y = t * 2; }
  indicesA();
  ecumeA.scale.setScalar(1 + Math.sin(t * 1.2) * .012);
  placerCamA();
  renderer.render(sceneA, camera);
  majBullesA();
  majPileA();
}

/* ══════════════════════════════════════════════════════════
   LA BOUCLE
   ══════════════════════════════════════════════════════════ */
const AVANT = new THREE.Vector3(), DROITE = new THREE.Vector3(), DIR = new THREE.Vector3();
let tPrec = performance.now(), tLent = 0, immobileDepuis = maintenant(), derniereAideAuto = 0, phasePas = 0, vitesseJoueur = 0;
function deplacerJoueur(dt, t) {
  const p = joueur.position, u = joueur.userData;
  DIR.set(0, 0, 0);
  let vitesse = vitesseMax();
  /* joystick ou clavier */
  let jx = joy.dx, jy = joy.dy;
  if (touches.has('arrowleft') || touches.has('q') || touches.has('a')) jx = -1;
  if (touches.has('arrowright') || touches.has('d')) jx = 1;
  if (touches.has('arrowup') || touches.has('z') || touches.has('w')) jy = -1;
  if (touches.has('arrowdown') || touches.has('s')) jy = 1;
  const force = Math.min(1, Math.hypot(jx, jy));
  if (force > .15) {
    trajet = null; quandArrive = null;
    AVANT.set(-Math.sin(cam.lacet), 0, -Math.cos(cam.lacet));
    DROITE.set(Math.cos(cam.lacet), 0, -Math.sin(cam.lacet));
    DIR.copy(DROITE).multiplyScalar(jx).addScaledVector(AVANT, -jy).normalize();
    vitesse *= Math.max(.45, force);
  } else if (trajet && trajet.length) {
    const [wx, wz] = trajet[0], dx = wx - p.x, dz = wz - p.z, d = Math.hypot(dx, dz);
    if (d < .18) {
      trajet.shift();
      if (!trajet.length) { trajet = null; const f = quandArrive; quandArrive = null; f && f(); }
    } else DIR.set(dx / d, 0, dz / d);
  }
  let bouge = 0;
  if (DIR.lengthSq() > 0) {
    const pas = vitesse * dt, nx = p.x + DIR.x * pas, nz = p.z + DIR.z * pas;
    /* on glisse le long des obstacles au lieu de rester collé */
    if (libre(nx, nz)) { p.x = nx; p.z = nz; bouge = pas; }
    else if (libre(nx, p.z)) { p.x = nx; bouge = pas * .7; }
    else if (libre(p.x, nz)) { p.z = nz; bouge = pas * .7; }
    else if (trajet) { trajet = null; quandArrive = null; }
    joueur.rotation.y = angle(joueur.rotation.y, Math.atan2(DIR.x, DIR.z), .25);
  }
  /* marche : jambes, bras, petit rebond, la pile qui tangue */
  vitesseJoueur = bouge / Math.max(dt, .001);
  const marche = vitesseJoueur > .5;
  if (marche) {
    immobileDepuis = maintenant();
    const avant = phasePas;
    phasePas += dt * 11 * Math.max(1, vitesseJoueur / VITESSES[0]);   /* les jambes vont plus vite avec les bottes */
    if (Math.floor(avant / Math.PI) !== Math.floor(phasePas / Math.PI)) (S.poney ? SFX.sabot : SFX.pas)();
  }
  const a = marche ? Math.sin(phasePas) : 0;
  if (S.poney) {
    /* à cheval : ce sont les jambes du poney qui trottent, Roullieee rebondit sur la selle */
    poney.userData.jambes.forEach((j, i) => { j.rotation.x = a * .6 * (i === 0 || i === 3 ? 1 : -1); });
    poney.position.y = marche ? Math.abs(Math.cos(phasePas)) * .08 : 0;
    u.jg.rotation.x = u.jd.rotation.x = 0;
    u.bg.rotation.x = -a * .3; u.bd.rotation.x = a * .3;
    u.corps.position.y = .7 + poney.position.y + (marche ? Math.abs(Math.sin(phasePas)) * .06 : 0);
  } else {
    u.jg.rotation.x = a * .7; u.jd.rotation.x = -a * .7;
    u.bg.rotation.x = -a * .6; u.bd.rotation.x = a * .6;
    u.corps.position.y = marche ? Math.abs(Math.cos(phasePas)) * .1 : 0;
  }
  pileGroupe.rotation.x += ((marche ? -.08 : 0) + Math.sin(t * 9) * (marche ? .03 : .008) - pileGroupe.rotation.x) * .2;
}
function boucle(tms) {
  requestAnimationFrame(boucle);
  const dt = Math.min(.05, (tms - tPrec) / 1000);
  tPrec = tms; horloge += dt;
  const t = horloge, now = maintenant();

  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i], k = Math.min(1, (horloge - a.t0) / a.duree);
    a.f(k);
    if (k >= 1) { anims.splice(i, 1); a.fin && a.fin(); }
  }
  if (mode === 'apprendre') { boucleApprendre(dt, t); return; }
  if (!$('#titre').classList.contains('cache') || !$('#modal').classList.contains('cache')) arreterJoyClavier();
  deplacerJoueur(dt, t);
  zones(dt);
  majBoutonEngrais();
  noterAttentes(now);
  aides.forEach(h => majAide(h, dt));
  majTravailAteliers(dt);
  majEtal(dt);
  /* la caméra suit Roullieee en douceur */
  cam.cible.lerp(tmpV.set(joueur.position.x, 0, joueur.position.z), 1 - Math.exp(-dt * 5));
  placerCamera();
  /* la dinde suit Roullieee, Médor suit la dinde (aussi vite qu'elle) */
  const vSuite = vitesseMax() + .3;
  const derriere = new THREE.Vector3(-Math.sin(joueur.rotation.y) * 1.5, 0, -Math.cos(joueur.rotation.y) * 1.5).add(joueur.position);
  if (dinde.position.distanceTo(derriere) > .6) bougerCompagnon(dinde, derriere, vSuite, dt, t, .15);
  dinde.children[0].userData.eventail.rotation.z = Math.sin(t * 1.5) * .1;

  for (const e of entites) {
    if (e.type === 'bete') bougerBete(e, dt, t);
    else if (e.type === 'champ' && e.plantes) {
      const p = S.champs[e.i];
      const k = clamp((now - p.t0) / (p.t1 - p.t0), 0, 1);
      e.plantes.scale.y = .12 + .88 * k;
      if (k >= 1 && !e.mur) { e.mur = true; e.tetes.forEach(m => m.material = mat(COULEUR_MUR[p.c])); rebond(e.obj); }
      if (e.mur) e.plantes.rotation.z = Math.sin(t * 2 + e.i) * .025;
    } else if (e.type === 'deco') {
      const u = e.obj.userData;
      if (e.D.suit) {
        const cible = new THREE.Vector3(-Math.sin(dinde.rotation.y) * 1.3, 0, -Math.cos(dinde.rotation.y) * 1.3).add(dinde.position);
        if (e.obj.position.distanceTo(cible) > .7) bougerCompagnon(e.obj, cible, vSuite, dt, t);
      } else if (e.D.promene) {
        if (e.attente > 0) e.attente -= dt;
        else if (e.obj.position.distanceTo(e.cible) < .2) {
          /* un pas au hasard autour de sa place, jamais dans l'eau ni dans une barrière */
          e.attente = rand(2, 6);
          const x = e.maison.x + rand(-3, 3), z = e.maison.z + rand(-3, 3);
          if (libre(x, z)) e.cible.set(x, 0, z);
        }
        else bougerCompagnon(e.obj, e.cible, 1.1, dt, t, e.D.saut || .06);
      }
      if (u.queue) u.queue.rotation.z = Math.sin(t * 8) * .4;
      if (u.roue) { u.roue.rotation.z += dt * .35; u.nacelles.forEach(n => { n.rotation.z = -u.roue.rotation.z; }); }
      if (u.manege) { u.manege.rotation.y += dt * .7; u.chevaux.forEach(c => { c.position.y = 1.1 + Math.sin(t * 3 + c.userData.ph * 1.6) * .25; }); }
      if (u.ballons) u.ballons.forEach((b, i) => { b.position.y += Math.sin(t * 1.5 + i) * .002; });
      if (u.eventail) u.eventail.rotation.z = Math.sin(t * 2) * .08;
      if (u.gouttes) u.gouttes.forEach(g => { const k = (t * .8 + g.userData.t) % 1; g.position.set(Math.cos(g.userData.a) * k * .9, 2.2 + Math.sin(k * Math.PI) * .6 - k * 1.5, Math.sin(g.userData.a) * k * .9); });
    } else if (e.type === 'arbre') {
      if (Math.hypot(joueur.position.x - e.obj.position.x, joueur.position.z - e.obj.position.z) < 1.8) secouerArbre(e);
    } else if (e.type === 'pommier' && e.i < S.pommiers) {
      /* les pommes grossissent vertes, puis rougissent ; on en voit moins à chaque cueillette */
      const pm = S.pommes[e.i], mur = now >= pm.t1, k = mur ? 1 : clamp(1 - (pm.t1 - now) / (VERGER.duree * 1000), 0, 1);
      const n = mur ? Math.ceil(pm.reste / VERGER.recolte * 8) : 8;
      e.obj.userData.pommes.forEach((m, j) => { m.visible = j < n; m.scale.setScalar(.35 + .65 * k); m.material = mat(mur ? '#dc2626' : '#9ccc65'); });
    }
  }
  /* contenu des auges et des caisses */
  for (const [id, e] of Object.entries(eAuges)) {
    const n = Math.min(S.auges[id], 6), sig = n + '';
    if (sig !== e.sig) { e.sig = sig; while (e.contenu.children.length) e.contenu.remove(e.contenu.children[0]); for (let i = 0; i < n; i++) { const m = fabMini(e.K.mange); m.position.set(-.55 + (i % 3) * .55, Math.floor(i / 3) * .2, 0); e.contenu.add(m); } }
  }
  for (const [id, e] of Object.entries(eCaisses)) {
    const n = Math.min(S.caisses[id], 9), sig = n + '';
    if (sig !== e.sig) { e.sig = sig; while (e.contenu.children.length) e.contenu.remove(e.contenu.children[0]); for (let i = 0; i < n; i++) { const m = fabMini(e.K.donne); m.position.set(-.35 + (i % 3) * .35, Math.floor(i / 3) * .22, (i % 2) * .2 - .1); e.contenu.add(m); } }
  }
  /* moulin, fumée, canards, tracteur, nuages, papillons */
  eMoulin.vitesse += (.6 - eMoulin.vitesse) * dt * .5;
  moulin.userData.pales.rotation.z -= eMoulin.vitesse * dt;
  maison.userData.fumee.forEach(s => {
    const v = s.userData.vite || 1;
    s.userData.t = (s.userData.t + dt * .25 * v) % 1;
    if (v > 1) s.userData.vite = Math.max(1, v - dt * 1.5);
    const k = s.userData.t;
    s.position.set(1.4 + Math.sin(k * 5) * .2, 5.5 + k * 3, -.6 - k * .5); s.scale.setScalar(.4 + k * 1.1); s.material.opacity = .85 * (1 - k);
  });
  canards.forEach(c => {
    const a = t * .35 + c.phase;
    c.obj.position.x = MARE[0] + Math.cos(a) * c.r; c.obj.position.z = MARE[1] + Math.sin(a) * c.r * .7; c.obj.rotation.y = -a;
    if (c.obj.position.y < .1) c.obj.position.y = .08 + Math.sin(t * 3 + c.phase) * .03;
  });
  /* le tracteur s'arrête pour laisser passer Roullieee */
  const et = eTracteur, prochePlayer = tracteur.position.distanceTo(joueur.position) < 3;
  if (prochePlayer) { if (!et.klaxonne) { et.klaxonne = true; SFX.klaxon(); } }
  else {
    et.klaxonne = false;
    tracteur.position.x += et.sens * 2.2 * dt;
    if (Math.abs(tracteur.position.x) > 25) { et.sens *= -1; tracteur.position.x = clamp(tracteur.position.x, -25, 25); }
    tracteur.userData.roues.forEach(r => r.rotation.x += et.sens * dt * 4);
  }
  tracteur.rotation.y = angle(tracteur.rotation.y, et.sens > 0 ? Math.PI / 2 : -Math.PI / 2, .05);
  for (const n of nuages) if (!n.occupe) n.obj.position.x = n.x0.x + Math.sin(t * .1 + n.x0.z) * 3;
  if (pluie.visible) pluie.children.forEach(g => { g.position.y -= dt * 14; if (g.position.y < 0) g.position.y = 7.5; });
  papillons.forEach(p => {
    const u = p.userData;
    p.position.set(u.cx + Math.sin(t * .5 + u.ph) * 4, 1.5 + Math.sin(t * 2 + u.ph) * .4, u.cz + Math.sin(t * .7 + u.ph * 2) * 3);
    p.rotation.y = t * .5 + u.ph; u.l.rotation.z = Math.sin(t * 18) * .9; u.r.rotation.z = -Math.sin(t * 18) * .9;
  });
  ecumes.forEach(c => c.scale.setScalar(1 + Math.sin(t * 1.2) * .012));
  /* le soleil (et ses ombres) se place au-dessus de l'île où est Roullieee */
  const ileSoleil = joueur.position.x > PONT.x0 ? ILE2.cx : 0;
  if (soleil.target.position.x !== ileSoleil) { soleil.target.position.set(ileSoleil, 0, 0); soleil.position.set(ileSoleil + 28, 50, 23); }
  /* flèche d'aide */
  if (fleche.visible) {
    fleche.position.set(flecheX, 3 + Math.abs(Math.sin(t * 4)) * .7, flecheZ);
    fleche.rotation.y = t * 2;
    if (now > flecheJusqua || Math.hypot(joueur.position.x - flecheX, joueur.position.z - flecheZ) < 1.5) fleche.visible = false;
  }
  /* un enfant immobile depuis un moment reçoit un coup de pouce */
  if ($('#titre').classList.contains('cache') && $('#modal').classList.contains('cache') && now - immobileDepuis > 12000 && now - derniereAideAuto > 25000) {
    derniereAideAuto = now; aide(true);
  }

  renderer.render(scene, camera);
  majBulles();
  majPile();
  tLent += dt;
  if (tLent > .25) { tLent = 0; majPieces(); majHud(); }
}
function arreterJoyClavier() { if (joy.actif) arreterJoy(); touches.clear(); }
syncPads();
requestAnimationFrame(boucle);

/* ══════════ DÉMARRAGE ══════════ */
majHud();
$('#pieces').textContent = S.pieces;
$('#charge').textContent = '';
$('#jouer').disabled = false;
$('#apprendre').disabled = false;
$('#apprendre').onclick = () => {
  ac();
  /* Safari (iPhone, iPad) ne parle qu'après une première phrase dite pendant un toucher */
  if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
  Object.values(banque).forEach(b => amorcer(b.a));
  amorcer(glouA);
  SFX.achat();
  entrerApprendre();
};
$('#jouer').onclick = () => {
  mode = 'jouer';
  ac();
  Object.values(banque).forEach(b => amorcer(b.a));
  amorcer(glouA);
  $('#titre').classList.add('cache');
  $('#hud').classList.remove('cache');
  majMusique();
  SFX.achat();
  immobileDepuis = maintenant();
  derniereAideAuto = maintenant();
  setTimeout(() => {
    parler('Bonjour ! Glisse ton doigt pour me faire marcher. Va dans le champ de blé pour récolter !');
    flecheX = POS_CHAMPS[0][0]; flecheZ = POS_CHAMPS[0][1]; flecheJusqua = maintenant() + 10000; fleche.visible = true;
  }, 600);
};
</script>
