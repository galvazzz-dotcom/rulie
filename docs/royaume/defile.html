<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>🦃 Le Grand Défilé des Dindies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="style.css">

<body>
<canvas id="toile"></canvas>
<div id="chargement"><div class="oeuf">🥚</div><p>Le défilé se prépare…</p></div>
<div id="ui" class="cache">
  <header class="haut">
    <a class="rond" href="index.html" aria-label="Retour au jeu">🏠</a>
    <button id="bLivre" class="rond" aria-label="Le Grand Livre">📖</button>
    <div class="titre"><span><b>Le Grand Défilé</b><small>Le Royaume des Dindies · aperçu</small></span></div>
    <button id="bDefile" class="rond" aria-label="Défilé automatique">▶</button>
  </header>
  <button id="bPrec" class="fleche g" aria-label="Dindie précédente">‹</button>
  <button id="bSuiv" class="fleche d" aria-label="Dindie suivante">›</button>
  <div id="actions">
    <button data-a="roue"><i>🦚</i><span>Roue</span></button>
    <button data-a="glouglou"><i>🎵</i><span>Glouglou</span></button>
    <button data-a="saut"><i>🦘</i><span>Saut</span></button>
    <button id="bStade"><i>🦃</i><span>Adulte</span></button>
    <button id="bChroma"><i>✨</i><span>Chroma</span></button>
  </div>
  <div id="cri" class="cri cache"></div>
  <section id="carte" class="carte"></section>
  <section id="livre" class="livre cache" aria-label="Le Grand Livre des Dindies">
    <div class="livreHaut"><b>📖 Le Grand Livre des Dindies</b><button id="bFermerLivre" class="rond petit" aria-label="Fermer">✖</button></div>
    <div id="filtres" class="filtres"></div>
    <div id="grille" class="grille"></div>
  </section>
</div>
<script type="module" src="js/defile-main.js"></script>
</body>
</html>
